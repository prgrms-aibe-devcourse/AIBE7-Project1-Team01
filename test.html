<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노을빛 여행 - 따뜻한 감성 여행 추천</title>
    <link rel="stylesheet" href="test_style.css">
</head>
<body>

    <header>
        <h1>Sunset Glow Travel</h1>
        <p>시선이 머무는 곳마다 평온함이 깃드는 여행</p>
    </header>

    <nav class="navbar">
        <div class="nav-brand-group">
            <a href="/" class="nav-logo">
                <span class="logo-placeholder"></span> 
                Motipe
            </a>
            <div class="nav-left">
                <a href="#">지도</a>
                <a href="#">캘린더</a>
            </div>
        </div>

        <div class="nav-right">
            <a href="#">로그인</a>
            <a href="#">회원가입</a>
            <a href="#">마이페이지</a>
        </div>
    </nav>

    <section class="hero">
        <h2>따스한 햇살이 머무는 곳으로</h2>
        <p>인위적인 것들을 뒤로하고 자연의 속도에 맞춰 걷는 시간</p>
        <br>
        <a href="#" class="cta-button">여정 시작하기</a>
    </section>

    <section class="search-section">
        <div class="search-bar-container">
            <input type="text" placeholder="어디로 떠나고 싶으신가요?" class="search-input">
            <button type="button" class="search-button">검색</button>
        </div>
        <div class="sub-buttons-container">
            <button type="button" class="small-button">지도 보기</button>
            <button type="button" class="small-button">캘린더 보기</button>
        </div>
    </section>

    <main class="container">
        <article>
            <h3>이달의 추천: "고요한 모래섬"</h3>
            <p>바쁜 일상에서 벗어나 파도 소리에 귀를 기울여보세요. 인적 드문 해변과 따뜻한 차 한 잔이 기다립니다.</p>
        </article>
        <article>
            <h3>여행자의 이야기</h3>
            <p>"이곳에서 만난 노을은 제 삶의 작은 터닝포인트가 되었습니다. 따뜻한 색감이 마음을 위로해주는 듯했어요."</p>
        </article>
    </main>

</body>
</html>
