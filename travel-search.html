    .form-area label { display: inline-block; width: 140px; font-size: 14px; }
    .form-area input, .form-area select { width: 260px; padding: 4px 8px; font-size: 14px; margin-bottom: 8px; }
    .form-area button { margin-top: 8px; padding: 6px 20px; font-size: 14px; cursor: pointer; }

    .key-area { background: #fff8e1; padding: 12px 16px; border: 1px solid #ffe082; margin-bottom: 20px; font-size: 14px; }
    .key-area label { display: inline-block; width: 80px; }
    .key-area input { width: 380px; padding: 4px 8px; font-size: 13px; font-family: monospace; }
    .key-notice { font-size: 12px; color: #888; margin-top: 6px; }

    #status { font-size: 14px; color: #555; margin-bottom: 10px; }
    #error  { font-size: 14px; color: red; margin-bottom: 10px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #333; color: #fff; padding: 8px; text-align: left; }
    td { padding: 8px; border-bottom: 1px solid #ddd; vertical-align: top; }
    tr:nth-child(even) { background: #fafafa; }

    .total { font-size: 13px; color: #555; margin-bottom: 8px; }
  </style>
</head>

    <label>영업상태코드</label>
    <select id="salsSttsCd">
      <option value="">전체</option>
      <option value="01">영업/정상</option>
      <option value="02">휴업</option>
      <option value="03">폐업</option>
      <option value="04">취소/말소/만료/정지/중지</option>
      <option value="05">제외/삭제/전출</option>
      <option value="06">기타</option>
    </select>
  </div>
  <button onclick="doSearch()">조회</button>
</div>

<div id="error"></div>
<div id="status"></div>
<div class="total" id="totalInfo"></div>

<table id="resultTable" style="display:none">
  <thead>
    <tr>
      <th>사업장명</th>
      <th>영업상태</th>
      <th>주소</th>
      <th>전화번호</th>
      <th>인허가일</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
  const BASE = 'https://apis.data.go.kr/1741000/comprehensive_travel_agencies/info';

  async function doSearch() {
    document.getElementById('error').textContent = '';
    document.getElementById('status').textContent = '불러오는 중...';
    document.getElementById('totalInfo').textContent = '';
    document.getElementById('resultTable').style.display = 'none';

    const apiKey     = document.getElementById('serviceKey').value.trim();
    const pageNo     = document.getElementById('pageNo').value || '1';
    const numOfRows  = document.getElementById('numOfRows').value || '10';
    const opnAtmyCd  = document.getElementById('opnAtmyGrpCd').value;
    const salsSttsCd = document.getElementById('salsSttsCd').value;

    if (!apiKey) {
      document.getElementById('status').textContent = '';
      document.getElementById('error').textContent = '인증키를 입력해주세요.';
      return;
    }

    const params = new URLSearchParams({
      serviceKey: apiKey,
      pageNo,
      numOfRows,
      returnType: 'json',
    });
    if (opnAtmyCd)  params.append('cond[OPN_ATMY_GRP_CD::EQ]', opnAtmyCd);
    if (salsSttsCd) params.append('cond[SALS_STTS_CD::EQ]', salsSttsCd);

    try {
      const res  = await fetch(`${BASE}?${params}`);
      const data = await res.json();

      document.getElementById('status').textContent = '';

      const header = data?.response?.header;
      if (header?.resultCode !== '0' && header?.resultCode !== '00') {
        document.getElementById('error').textContent = '오류: ' + (header?.resultMsg || JSON.stringify(data));
        return;
      }

      const body  = data.response.body;
      const total = body.totalCount;
      const raw   = body.items?.item;
      const list  = Array.isArray(raw) ? raw : (raw ? [raw] : []);

      document.getElementById('totalInfo').textContent =
        `총 ${Number(total).toLocaleString()}건 / 현재 페이지: ${pageNo} / ${list.length}건 표시`;

      const tbody = document.getElementById('tbody');
      tbody.innerHTML = list.length === 0
        ? '<tr><td colspan="5" style="text-align:center;color:#999">결과 없음</td></tr>'
        : list.map(d => `
            <tr>
              <td>${d.BPLC_NM || '-'}</td>
              <td>${d.DTL_SALS_STTS_NM || d.SALS_STTS_NM || '-'}</td>
              <td>${d.ROAD_NM_ADDR || d.LOTNO_ADDR || '-'}</td>
              <td>${d.TELNO || '-'}</td>
              <td>${d.LCPMT_YMD || '-'}</td>
            </tr>`).join('');

      document.getElementById('resultTable').style.display = 'table';

    } catch (err) {
      document.getElementById('status').textContent = '';
      document.getElementById('error').textContent = '요청 실패: ' + err.message;
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
</script>

</body>
</html>
