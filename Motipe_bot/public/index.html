<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motipe - 대화형 축제 추천</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="chat-section">
            <h2>💬 Motipe AI 챗봇</h2>
            <div class="chat-box" id="chatBox">
                <div class="message assistant">안녕하세요! 지역 축제에 따른 여행지를 알려드릴게요. [행사]라는 키워드를 포함하여 입력해서 대화를 시작하세요!</div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">전송</button>
            </div>
        </div>

        <div class="dashboard-section">
            <h2>🗂️ 나의 여행 매니저 (CRUD)</h2>
            
            <div class="card">
                <h3>📌 추천된 여행지 바로 임시 저장 (Scrap)</h3>
                <div id="recommendation-container">추천된 축제가 이곳에 표시됩니다.</div>
            </div>

            <div class="card">
                <h3>❤️ 내가 스크랩한 축제 목록</h3>
                <ul id="savedList"></ul>
            </div>

            <div class="card">
                <h3>✈️ 나의 과거 여행 이력 관리</h3>
                <div class="history-form">
                    <input type="text" id="histName" placeholder="여행지명">
                    <input type="date" id="histDate">
                    <button onclick="addHistory()">기록 추가</button>
                </div>
                <ul id="history-list"></ul>
            </div>

<div class="planner-photo-card" style="width: 399px; margin: 20px auto; font-family: sans-serif;">
    <h4 style="margin-bottom: 10px; color: #333;">🗺️ 추천 여행지 사진</h4>
    
    <div class="photo-box" style="width: 399px; height: 224px; position: relative; background-color: #e9ecef; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <div id="photo-loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #6c757d; font-size: 14px;">
            📸 이미지를 불러오는 중...
        </div>
        <img id="planner-img" src="" alt="추천 여행지 사진" style="width: 399px; height: 224px; object-fit: cover; display: none;" />
    </div>
    
    <p id="unsplash-credit" style="font-size: 11px; color: #888; margin-top: 6px; text-align: right; display: none;">
        Photo by <a id="author-link" href="#" target="_blank" style="color: #495057; text-decoration: underline;"></a> on Unsplash
    </p>
</div>


        </div>
    </div>
    

    <script src="app.js"></script>
</body>
</html>
