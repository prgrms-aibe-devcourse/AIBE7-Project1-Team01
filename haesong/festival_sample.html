<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>축제 상세 정보 - MOTIPE</title>
    <!-- 공통 및 축제 스타일이 통합된 CSS 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <nav class="navbar">
        <div class="nav-brand-group">
            <a href="main.html" class="nav-logo">
                <img src="icons/screen.png" alt="Motipe 로고" class="nav-logo-img"> 
            </a>
            <div class="nav-left">
                <a href="#">지도</a>
                <a href="#">캘린더</a>
                <a href="community.html">커뮤니티</a>
            </div>
        </div>

        <div class="nav-right">
            <a href="#" class="nav-btn-outline">로그인</a>
            <a href="#" class="nav-btn-outline">회원가입</a>
            <a href="mypage.html" class="nav-icon-link">
                <img src="icons/mypage-icon.png" alt="마이페이지" class="nav-mypage-img">
            </a>
        </div>
    </nav>

    <div class="festival-upper-container">
    <div class="festival-image-wrapper">
        <img src="" alt="축제 대표 이미지" id="api-festival-img">
    </div>
    
    <div class="festival-info-wrapper">
        <h1 class="festival-title" id="api-festival-title">로딩 중...</h1>
        
        <div class="festival-meta">
            <div class="meta-item">
                <span class="meta-label">개최장소</span> 
                <span id="api-festival-location"></span>
            </div>
            <div class="meta-item">
                <span class="meta-label">축제일자</span> 
                <span id="api-festival-date"></span>
            </div>
            <div class="meta-item">
                <span class="meta-label">전화번호</span> 
                <span id="api-festival-phone"></span>
            </div>
            <div class="meta-item">
                <span class="meta-label">홈페이지</span> 
                <a href="#" id="api-festival-web" target="_blank"></a>
            </div>
        </div>

        <div class="festival-description-box">
            <div class="festival-description" id="api-festival-desc">
                데이터를 불러오는 중입니다...
            </div>
        </div>
    </div>
</div>

    <!-- [신규 추가] 하단 리뷰 등록 영역 (가로 규격 1100px 컨테이너 준수) -->
    <div class="review-section-container">
        <div class="review-write-box">
            <h3 class="review-title">축제 리뷰 남기기</h3>
            
            <form class="review-form">
                <!-- 별점 선택 영역 -->
                <div class="rating-select-group">
                    <span class="rating-label">별점 선택</span>
                    <div class="stars">
                        <span class="star-icon">★</span>
                        <span class="star-icon">★</span>
                        <span class="star-icon">★</span>
                        <span class="star-icon">★</span>
                        <span class="star-icon">★</span>
                    </div>
                </div>

                <!-- 리뷰 작성 박스 및 제출 버튼 -->
                <div class="review-input-group">
                    <textarea class="review-textarea" placeholder="축제에 대한 따뜻한 후기를 남겨주세요 (최대 300자)"></textarea>
                    <button type="submit" class="review-submit-btn">리뷰 제출</button>
                </div>
            </form>
        </div>
    </div>

   <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. 주소창에서 name=축제명 파라미터 안전하게 가로채기 (디코딩 자동 완료)
            const urlParams = new URLSearchParams(window.location.search);
            const festivalName = urlParams.get('name');

            if (!festivalName) {
                alert('올바르지 않은 접근입니다. 축제 검색 리스트로 이동합니다.');
                window.location.href = 'festival_list.html';
                return;
            }

            // 2. 실시간 주입 연동 메서드 호출
            loadFestivalDataFromJSON(festivalName);
        });

        async function loadFestivalDataFromJSON(targetName) {
            try {
                // 같은 서버/폴더 내 전국문화축제표준데이터.json 비동기 호출
                const response = await fetch('전국문화축제표준데이터.json');
                if (!response.ok) throw new Error('데이터 통신 실패');
                
                const data = await response.json();

                // 3. records 배열에서 축제명 문자열이 정확하게 매칭되는 1개의 객체 탐색
                const matchedRecord = data.records.find(record => {
                    return record.축제명.trim() === targetName.trim();
                });

                if (!matchedRecord) {
                    document.getElementById('api-festival-title').textContent = "등록된 축제 정보를 찾을 수 없습니다.";
                    return;
                }

                // 4. 오직 id 속성만을 타격하여 공공 데이터 매핑 인풋
                document.getElementById('api-festival-title').textContent = matchedRecord.축제명;
                document.getElementById('api-festival-location').textContent = 
                    `${matchedRecord.개최장소} (${matchedRecord.소재지도로명주소})`;
                document.getElementById('api-festival-date').textContent = 
                    `${matchedRecord.축제시작일자} ~ ${matchedRecord.축제종료일자}`;
                    
                document.getElementById('api-festival-phone').textContent = 
                    matchedRecord.전화번호 ? matchedRecord.전화번호 : "정보 없음";
                document.getElementById('api-festival-desc').textContent = 
                    matchedRecord.축제내용 ? matchedRecord.축제내용 : "상세 소개 정보가 제공되지 않는 축제입니다.";

                // 홈페이지 링크 바인딩 제어
                const webLink = document.getElementById('api-festival-web');
                if (matchedRecord.홈페이지주소 && matchedRecord.홈페이지주소.trim() !== "") {
                    webLink.href = matchedRecord.홈페이지주소;
                    webLink.textContent = matchedRecord.홈페이지주소;
                } else {
                    webLink.textContent = "공식 홈페이지 없음";
                    webLink.removeAttribute('href');
                }

                // 임시 플레이스홀더 이미지 바인딩
                const imgContainer = document.getElementById('api-festival-img');
                imgContainer.src = "https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=800&q=80";
                imgContainer.alt = matchedRecord.축제명;

            } catch (error) {
                console.error("데이터 바인딩 실패 에러 로그:", error);
                document.getElementById('api-festival-title').textContent = "서버 데이터 로드 오류";
            }
        }
    </script>
</body>
</html>
